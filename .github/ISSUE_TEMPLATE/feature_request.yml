name: Idea or feature request
description: Something SCC should be able to do
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
      description: Describe the situation you are in and what would help. Screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you solve it today?
      description: What is the workaround, and why is it annoying?

  - type: input
    id: mods
    attributes:
      label: Does this involve another mod?
      description: If it is about compatibility, name the mod and the version.
      placeholder: Mekanism 10.7.x
